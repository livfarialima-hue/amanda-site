name: Bruna protected change

on:
  pull_request:
  push:
    branches:
      - reestruturacao-site

permissions:
  contents: read

concurrency:
  group: bruna-guard-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Architecture, contracts and regression
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out complete history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Use Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install pinned dependencies
        run: npm ci

      - name: Validate declared change scope
        run: npm run change:check

      - name: Protect Bruna module ownership and growth limits
        run: npm run bruna:guard

      - name: Validate journey boundaries
        run: npm run architecture:check

      - name: Run the complete regression suite
        run: npm test

      - name: Build and validate the static site
        run: |
          npm run site:build
          npm run site:check
