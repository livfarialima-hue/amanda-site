name: Remove temporary reminder release files

on:
  push:
    paths:
      - .github/workflows/apply-reminder-address.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove temporary files
        run: rm -f codex-reminder-address-20260812.zip .github/workflows/apply-reminder-address.yml
      - name: Commit cleanup
        run: |
          git config user.name "Codex"
          git config user.email "codex@users.noreply.github.com"
          git add -A
          git commit -m "Remove arquivos temporários de publicação"
          git push
