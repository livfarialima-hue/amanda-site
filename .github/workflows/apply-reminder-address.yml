name: Apply reminder address patch

on:
  push:
    paths:
      - codex-reminder-address-20260812.zip
      - .github/workflows/apply-reminder-address.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch archive
        run: unzip -o codex-reminder-address-20260812.zip
      - name: Remove temporary release files
        run: rm -f codex-reminder-address-20260812.zip .github/workflows/apply-reminder-address.yml
      - name: Install dependencies
        run: npm ci
      - name: Validate project
        run: npm test
      - name: Commit final source
        run: |
          git config user.name "Codex"
          git config user.email "codex@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Inclui endereço e mapa nos lembretes"
          git push
